[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12", features = [
  "gzip",
  "brotli",
  "deflate",
  "json",
  "cookies",
  "rustls-tls",
  "http2",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures = "0.3.32"
rusqlite = "0.38.0"
sha2 = "0.10.9"
hex = "0.4.3"
cookie_store = "0.22.1"
regex = "1.13.1"
scraper = "0.27.0"
rand = "0.10.2"
once_cell = "1.21.4"
quick-xml = { version = "0.41.0", features = ["serialize"] }
uuid = { version = "1.24.0", features = ["v4"] }
csv = "1.4.0"
parquet = { version = "59.2.0", features = ["arrow"] }
arrow = "59.2.0"
redb = "4"
bincode = "1.3.3"
dotenvy = "0.15.7"
